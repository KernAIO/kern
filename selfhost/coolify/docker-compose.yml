# Kern on Coolify.
#
# The same stack as ../docker-compose.yml with the parts that assume a bare host taken out. Coolify
# owns ports 80 and 443, issues the certificate and keeps the environment itself, so this file:
#
#   * publishes no ports — Coolify's proxy reaches Caddy over the Docker network;
#   * writes Caddy's config from inside the container, because a Compose file pasted into Coolify
#     has no files next to it to mount;
#   * takes every secret from a Coolify magic variable, so there is nothing to generate by hand;
#   * derives every URL from the domain Coolify assigns, so changing the domain is one edit.
#
# Kern still runs its own Caddy. That is what turns one domain into six services — /api to core,
# /api/chat and /ws to chat, /collab to collab, /kern to MinIO, the rest to the app. Doing that from
# Coolify's proxy would mean six domains or six sets of labels.
#
# Deploy it as a Docker Compose resource, either from this repository (base directory
# /selfhost/coolify) or by pasting the file:
# https://docs.kernaio.com/self-hosting/coolify/
#
# Set these in Coolify's Environment Variables tab before the first deploy:
#   KERN_ADMIN_EMAIL   required. The first admin account, created on the first boot and never
#                      again. There is no default: it would be a real instance administrator at an
#                      address you do not own. The deploy fails with a message until you set it.
#   KERN_VERSION       pin a release instead of following `latest`. Worth doing — `latest` can hand
#                      five services five different builds if a pull lands mid-release.

x-kern-env: &kern-env
  NODE_ENV: production
  KERN_BASE_URL: ${SERVICE_URL_CADDY}
  KERN_SECRET: ${SERVICE_BASE64_64_KERNSECRET}
  # kern_app, not the bootstrap superuser — see the db-init service below.
  DATABASE_URL: postgres://kern_app:${SERVICE_PASSWORD_APPDB}@postgres:5432/kern
  NATS_URL: nats://nats:4222
  VALKEY_URL: redis://valkey:6379
  S3_ENDPOINT: http://minio:9000
  # The bare origin, with no path of its own: presigned URLs are SigV4 signatures over the
  # canonical path, and Caddy routes /kern/* to MinIO without stripping, so the path MinIO
  # receives is the path core signed. A `/s3` prefix here is what made every upload 403.
  S3_PUBLIC_ENDPOINT: ${SERVICE_URL_CADDY}
  S3_REGION: us-east-1
  S3_BUCKET: kern
  S3_ACCESS_KEY: kern
  S3_SECRET_KEY: ${SERVICE_PASSWORD_MINIO}
  SMTP_URL: ${SMTP_URL:-}
  MAIL_FROM: ${MAIL_FROM:-Kern <no-reply@localhost>}
  BETTER_AUTH_SECRET: ${SERVICE_BASE64_64_AUTHSECRET}
  BETTER_AUTH_URL: ${SERVICE_URL_CADDY}
  CORE_URL: http://core:4000
  CHAT_URL: http://chat:4100
  MAIL_URL: http://mail:4200
  COLLAB_URL: http://collab:4300
  # Calls need a LiveKit server with its own UDP port, which is not something Coolify's proxy can
  # front. Point these at a LiveKit you run separately, or leave them alone and calls stay off.
  #
  # Bare keys, not `${LIVEKIT_URL:-}`. The default form emits the key with an *empty value*, and an
  # empty string is a value a zod schema tells apart from an absence: `KERN_SIGNUP: ${KERN_SIGNUP:-}`
  # is what stopped core booting on every fresh install for a fortnight. A bare key sets the variable
  # only when the host actually sets it. `docker compose config` prints `null` either way, so this is
  # verified by running a container, never by reading the config.
  LIVEKIT_URL:
  LIVEKIT_API_KEY:
  LIVEKIT_API_SECRET:
  # Billing. Empty on a normal install: the module ships in the image and does nothing until an
  # instance both defines plans and sets a Stripe key.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  KERN_DEFAULT_PLAN_SLUG: ${KERN_DEFAULT_PLAN_SLUG:-}
  # `open` lets anyone create an account; `invite` limits it to an invitation or an administrator.
  # It seeds the setting on the very first boot only — afterwards Admin -> Settings owns it, and
  # changing this does nothing. Unset is the safe default for a server on the internet: core then
  # seeds invite-only whenever a bootstrap admin is configured below.
  #
  # Written with no value on purpose — Compose's pass-through form, which passes the variable only
  # when it is actually set in Coolify's environment. Interpolating it with an empty `:-` default
  # sets it to the empty string instead, and core's `z.enum(['open','invite']).optional()` rejects ''
  # as "Invalid option", so core throws at boot and everything waiting on its health never starts.
  KERN_SIGNUP:

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Declaring the magic variable is what makes Coolify hand this stack a domain and point its
    # proxy at port 80. Everything else reads ${SERVICE_URL_CADDY}, so the domain is set in one
    # place: Coolify -> Configuration -> Domains.
    environment:
      - SERVICE_URL_CADDY_80
    entrypoint: ["/bin/sh", "-c"]
    # Keep these routes in step with ../Caddyfile. The only differences are deliberate: the site
    # address is :80 because Coolify terminates TLS, and there is no acme block for the same reason.
    command:
      - |
        cat >/etc/caddy/Caddyfile <<'CADDYFILE'
        {
          # Coolify's proxy sits in front on a private address. Without trusting it, Caddy would
          # replace the client IP with the proxy's and rewrite X-Forwarded-Proto to http, so every
          # service behind here would believe the request arrived over plain HTTP.
          servers {
            trusted_proxies static private_ranges
          }
        }

        :80 {
          encode zstd gzip

          # realtime + chat service
          @chat path /api/chat/* /ws /ws/*
          handle @chat {
            reverse_proxy chat:4100
          }
          # mail service
          handle_path /api/mail/* {
            rewrite * /api/mail{uri}
            reverse_proxy mail:4200
          }
          # collaborative editing (Yjs)
          handle /collab* {
            reverse_proxy collab:4300
          }
          # LiveKit signalling. Nothing in Kern uses it — calls are not built. LiveKit serves it at
          # /rtc, so the prefix is stripped: /livekit/rtc reaches LiveKit as /rtc. Only those two
          # paths; the twirp admin API is deliberately not routed from the edge. The livekit service
          # below is commented out, so this answers 502 until somebody uncomments it.
          @livekit path /livekit/rtc /livekit/rtc/*
          handle @livekit {
            uri strip_prefix /livekit
            reverse_proxy livekit:7880
          }
          # object storage (presigned URLs) — routed by bucket name, with NO stripping, because
          # SigV4 signs the path MinIO must receive. Coolify assigns one domain, so there is no
          # second hostname to give MinIO here; /kern is safe because it is reserved in core.
          handle /kern/* {
            reverse_proxy minio:9000
          }
          # MCP, and the OAuth discovery documents an MCP client fetches before it connects. core
          # serves these at the ROOT of its Fastify app — the paths are fixed by the MCP and
          # RFC 8414/9728 specifications — so `handle /api/*` never saw them and they fell through
          # to the app, which answered HTML. Keep this above the catch-all.
          @mcp path /mcp /mcp/* /.well-known/oauth-protected-resource /.well-known/oauth-protected-resource/* /.well-known/oauth-authorization-server
          handle @mcp {
            reverse_proxy core:4000
          }
          # core API (auth, workspaces, all other modules) + OpenAPI
          handle /api/* {
            reverse_proxy core:4000
          }
          # web app (SvelteKit)
          handle {
            reverse_proxy app:3000
          }

          header {
            X-Content-Type-Options nosniff
            Referrer-Policy strict-origin-when-cross-origin
            Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)"
            Content-Security-Policy "frame-ancestors 'none'"
            X-Frame-Options DENY
            Strict-Transport-Security "max-age=31536000; includeSubDomains"
            -Server
          }
        }
        CADDYFILE
        caddy fmt --overwrite /etc/caddy/Caddyfile
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on: [app, core]

  app:
    image: ${KERN_IMAGE_SHELL:-ghcr.io/kernaio/shell}:${KERN_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *kern-env
      PORT: 3000
      ORIGIN: ${SERVICE_URL_CADDY}
      PUBLIC_API_URL: ${SERVICE_URL_CADDY}
      PUBLIC_WS_URL: ${SERVICE_URL_CADDY}/ws
      PUBLIC_COLLAB_URL: ${SERVICE_URL_CADDY}/collab
      # Where the app reaches core when it renders a page itself. The PUBLIC_* addresses above are
      # browser addresses; using one for a server-side call sends the shell container out through
      # Caddy, out through Coolify's proxy, and back in to reach a service one hop away. Server-side
      # rendering of published Quire pages is what depends on it.
      KERN_API_ORIGIN: ${KERN_API_ORIGIN:-http://core:4000}
      # Which social buttons the sign-in and sign-up screens draw — a comma-separated subset of
      # google,github,microsoft. The shell cannot ask core what is configured, so this list is what
      # decides whether a button exists; the credentials on core decide whether pressing it works.
      PUBLIC_AUTH_PROVIDERS:
    depends_on: [core]

  core:
    image: ${KERN_IMAGE_CORE:-ghcr.io/kernaio/core}:${KERN_VERSION:-latest}
    restart: unless-stopped
    # KERN_ADMIN_EMAIL has no default on purpose. Core's bootstrap creates this address as a real
    # instance admin — a superuser-equivalent view of every workspace on the instance — on the
    # first boot. A placeholder default therefore creates a live administrator at an address the
    # operator does not own and cannot receive a password reset for, and nothing later notices.
    # Failing the deploy with a message is the honest answer; set it in Coolify's Environment
    # Variables tab before the first deploy. After an admin exists both of these are ignored.
    environment:
      <<: *kern-env
      PORT: 4000
      KERN_ADMIN_EMAIL: ${KERN_ADMIN_EMAIL:?set KERN_ADMIN_EMAIL to the first administrator's email address before deploying}
      KERN_ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN}
      # Social sign-in. On core alone, because core is the only service that reads them and a client
      # secret handed to every container is a secret with six ways out. Each is a bare key —
      # Compose's pass-through form — so a provider you have not configured in Coolify's Environment
      # Variables tab stays absent rather than arriving as an empty string.
      #
      # Setting these makes the provider work; it does not make a button appear. Add the provider's
      # name to PUBLIC_AUTH_PROVIDERS on the app service for that.
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      GITHUB_CLIENT_ID:
      GITHUB_CLIENT_SECRET:
      MICROSOFT_CLIENT_ID:
      MICROSOFT_CLIENT_SECRET:
      # Absent means `common` — any Microsoft account. Set it to a directory id to admit one tenant.
      MICROSOFT_TENANT_ID:
    depends_on:
      db-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      nats: { condition: service_started }
      valkey: { condition: service_started }
      minio: { condition: service_started }
    # No healthcheck override here. The image already carries one, and it is the only kind that
    # can work: node:24-slim has neither wget nor curl, so a `wget` test can never run, and the
    # service listens on IPv4 only, so `localhost` resolves to ::1 and is refused. The override
    # that used to sit here failed on both counts, so core was permanently unhealthy — and
    # core-worker, chat, mail and collab all wait on `condition: service_healthy`, so none of
    # them ever started. The Dockerfile probes 127.0.0.1 with `node -e fetch(...)` instead.

  core-worker:
    image: ${KERN_IMAGE_CORE:-ghcr.io/kernaio/core}:${KERN_VERSION:-latest}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *kern-env
    depends_on: { core: { condition: service_healthy } }

  # Each of these owns module schemas and migrates them in its own process at boot, so each waits
  # on db-init as well as on core.
  chat:
    image: ghcr.io/kernaio/chat:${KERN_VERSION:-latest}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4100 }
    depends_on: { core: { condition: service_healthy }, db-init: { condition: service_completed_successfully } }

  # MAIL_WEBHOOK_TOKEN is the shared secret a provider's bounce and complaint webhooks must present.
  # Without it the endpoint is open to the internet, and a forged bounce permanently suppresses an
  # address instance-wide. It is a Coolify magic variable, so Coolify generates it on the first
  # deploy and there is nothing to set by hand; it is on this service alone because nothing else
  # reads it.
  mail:
    image: ghcr.io/kernaio/mail:${KERN_VERSION:-latest}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4200, MAIL_WEBHOOK_TOKEN: "${SERVICE_PASSWORD_MAILWEBHOOK}" }
    depends_on: { core: { condition: service_healthy }, db-init: { condition: service_completed_successfully } }

  collab:
    image: ghcr.io/kernaio/collab:${KERN_VERSION:-latest}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4300 }
    depends_on: { core: { condition: service_healthy }, db-init: { condition: service_completed_successfully } }

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    # No init script is mounted, unlike the host install — nothing can be, a pasted Compose file has
    # no files beside it. The db-init service below does that work instead, and it is the better
    # place for it anyway: an init script runs only on a data directory created from nothing.
    environment: { POSTGRES_USER: kern, POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}", POSTGRES_DB: kern }
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U kern"], interval: 5s, timeout: 5s, retries: 20 }

  # Runs to completion on every deploy, before any service starts. Identical to the host install's
  # db-init; keep the two in step. Two jobs, both idempotent:
  #
  #   1. The extensions. A module reaching for one nobody created fails inside its own migration,
  #      and a module migration that throws takes down the whole host service — core hosts five and
  #      would never bind :4000. module-inventory needs btree_gist.
  #   2. The role the services connect as. POSTGRES_USER is this image's bootstrap superuser, and a
  #      superuser bypasses row-level security unconditionally, so every `force row level security`
  #      in every migration was dead. kern_app is NOSUPERUSER NOBYPASSRLS and owns the database and
  #      everything already in it, which is what makes the policies start applying. That matters
  #      most here and on Kern Cloud, where workspaces belonging to strangers share one database.
  #
  # The SQL contains no `$` at all, on purpose: Compose interpolates a command string before the
  # shell ever sees it. So no `do $$ … $$` blocks — the conditional statements are `\gexec` — and
  # the password reaches psql through `\getenv` rather than through the shell.
  db-init:
    image: pgvector/pgvector:pg18
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGHOST: postgres
      PGUSER: kern
      PGPASSWORD: "${SERVICE_PASSWORD_POSTGRES}"
      PGDATABASE: kern
      KERN_DB_APP_PASSWORD: "${SERVICE_PASSWORD_APPDB}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -q -f - <<'SQL'
        \getenv app_password KERN_DB_APP_PASSWORD

        CREATE EXTENSION IF NOT EXISTS vector;
        CREATE EXTENSION IF NOT EXISTS pg_trgm;
        CREATE EXTENSION IF NOT EXISTS ltree;
        CREATE EXTENSION IF NOT EXISTS pgcrypto;
        CREATE EXTENSION IF NOT EXISTS btree_gist;

        SELECT 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
        WHERE EXISTS (SELECT 1 FROM pg_available_extensions WHERE name = 'pg_stat_statements')
        \gexec

        SELECT 'CREATE ROLE kern_app LOGIN'
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'kern_app')
        \gexec

        ALTER ROLE kern_app WITH LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE
          PASSWORD :'app_password';

        SELECT format('ALTER DATABASE %I OWNER TO kern_app', current_database())
        \gexec

        SELECT format('ALTER SCHEMA %I OWNER TO kern_app', nspname)
        FROM pg_namespace
        WHERE nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND nspname NOT IN ('information_schema', 'public')
          AND nspowner <> 'kern_app'::regrole
          AND NOT EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_namespace'::regclass AND d.objid = pg_namespace.oid
                            AND d.deptype = 'e')
        \gexec

        SELECT format('ALTER %s %I.%I OWNER TO kern_app',
                      CASE c.relkind WHEN 'S' THEN 'SEQUENCE'
                                     WHEN 'v' THEN 'VIEW'
                                     WHEN 'm' THEN 'MATERIALIZED VIEW'
                                     WHEN 'f' THEN 'FOREIGN TABLE'
                                     ELSE 'TABLE' END,
                      n.nspname, c.relname)
        FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
        WHERE n.nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND n.nspname <> 'information_schema'
          AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
          AND c.relowner <> 'kern_app'::regrole
          AND NOT EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                            AND d.deptype = 'e')
          AND NOT (c.relkind = 'S' AND EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                            AND d.deptype IN ('a', 'i')))
        \gexec

        SELECT format('ALTER ROUTINE %s OWNER TO kern_app', p.oid::regprocedure)
        FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
        WHERE n.nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND n.nspname <> 'information_schema'
          AND p.proowner <> 'kern_app'::regrole
          AND NOT EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_proc'::regclass AND d.objid = p.oid AND d.deptype = 'e')
        \gexec

        SELECT format('ALTER TYPE %s OWNER TO kern_app', t.oid::regtype)
        FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND n.nspname <> 'information_schema'
          AND t.typtype IN ('e', 'c', 'd', 'r')
          AND t.typowner <> 'kern_app'::regrole
          AND NOT EXISTS (SELECT 1 FROM pg_class c WHERE c.reltype = t.oid)
          AND NOT EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_type'::regclass AND d.objid = t.oid AND d.deptype = 'e')
        \gexec

        SELECT format('GRANT ALL ON DATABASE %I TO kern_app', current_database())
        \gexec

        SELECT format('GRANT ALL ON SCHEMA %I TO kern_app', nspname)
        FROM pg_namespace
        WHERE nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND nspname <> 'information_schema'
        \gexec
        SQL

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data"]
    volumes: ["natsdata:/data"]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1000", "--appendonly", "no"]
    volumes: ["valkeydata:/data"]

  # Pinned, not `latest`: a stack whose selling point is a reproducible deploy cannot have its
  # object store change underneath it, and MinIO has changed licence and dropped features on
  # `latest`. Move it deliberately, in a commit.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment: { MINIO_ROOT_USER: kern, MINIO_ROOT_PASSWORD: "${SERVICE_PASSWORD_MINIO}" }
    volumes: ["miniodata:/data"]

  # Runs once and exits. Nothing creates the bucket at upload time, so files fail without it.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 kern ${SERVICE_PASSWORD_MINIO} && mc mb -p local/kern || true"

  # LiveKit, for calls. Commented out, and it stays that way until you want calls: Coolify has no
  # way to pass `--profile calls`, so anything present here runs on every deploy, and an idle
  # container nobody asked for is a container an operator has to explain to themselves.
  #
  # To turn calls on: uncomment this service, uncomment the two ports, open 7881/tcp and 7882/udp on
  # the host's firewall, and set LIVEKIT_URL=ws://livekit:7880 and LIVEKIT_API_KEY=kern in Coolify's
  # Environment Variables tab. Media does not pass through Coolify's proxy or through Caddy — it
  # goes to those two ports directly — so the server's public address has to be reachable. Signalling
  # does go through Caddy, on the /livekit/rtc route above.
  #
  # The configuration is an environment variable rather than the mounted /etc/livekit.yaml the host
  # install uses, because a Compose file pasted into Coolify has no files beside it to mount. It
  # therefore contains no `$` at all: Compose interpolates a value before the container sees it, so a
  # `${...}` here would be substituted, and a bare `$` would be an interpolation error. That is why
  # the API key is the literal `kern` — the same reason the mounted file names it.
  #
  # Keep this in step with ../livekit.yaml; the two describe the same server.
  #
  # livekit:
  #   image: livekit/livekit-server:v1.13.6
  #   restart: unless-stopped
  #   environment:
  #     LIVEKIT_KEYS: "kern: ${SERVICE_PASSWORD_LIVEKIT}"
  #     LIVEKIT_CONFIG: |
  #       port: 7880
  #       rtc:
  #         tcp_port: 7881
  #         udp_port: 7882
  #         use_external_ip: true
  #       turn:
  #         enabled: false
  #       room:
  #         auto_create: false
  #       webhook:
  #         api_key: kern
  #         urls:
  #           - http://core:4000/api/meet/webhooks/livekit
  #   # The only ports this stack publishes. Everything else reaches Coolify's proxy over the Docker
  #   # network; media cannot, because it is not HTTP.
  #   ports: ["7881:7881", "7882:7882/udp"]

  # Office and PDF previews. Opt-in on a host install (--profile preview) and always on here, because
  # Coolify has no way to pass a profile. Nothing calls it yet — previews are not built — so today it
  # sits idle. Delete the service if you would rather not run it until they are.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

volumes: { pgdata: {}, natsdata: {}, valkeydata: {}, miniodata: {} }
