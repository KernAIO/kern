# Kern self-host distribution. `./install.sh` prepares .env, then `docker compose up -d`.
# Optional profiles: --profile calls (LiveKit), --profile preview (Gotenberg office/PDF previews),
#                    --profile observability (GlitchTip)
name: kern
x-kern-env: &kern-env
  NODE_ENV: production
  KERN_BASE_URL: ${KERN_BASE_URL}
  KERN_SECRET: ${KERN_SECRET}
  # kern_app, not POSTGRES_USER. POSTGRES_USER is the image's bootstrap superuser, and a superuser
  # bypasses row-level security unconditionally — every `force row level security` in every
  # migration is dead while the services connect as one. `db-init` creates this role NOSUPERUSER
  # NOBYPASSRLS and hands it ownership of the database, which is what makes the policies apply.
  DATABASE_URL: postgres://kern_app:${KERN_DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
  NATS_URL: nats://nats:4222
  VALKEY_URL: redis://valkey:6379
  S3_ENDPOINT: ${S3_ENDPOINT}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT}
  S3_REGION: ${S3_REGION}
  S3_BUCKET: ${S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  SMTP_URL: ${SMTP_URL}
  MAIL_FROM: ${MAIL_FROM}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  BETTER_AUTH_URL: ${KERN_BASE_URL}
  CORE_URL: http://core:4000
  CHAT_URL: http://chat:4100
  MAIL_URL: http://mail:4200
  COLLAB_URL: http://collab:4300
  LIVEKIT_URL: ws://livekit:7880
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
  # Billing. Empty on a normal install: the module ships in the image and does nothing until an
  # instance both defines plans and sets a Stripe key, so a self-hosted Kern has no limits at all.
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  # Slug of the plan a brand-new workspace starts on. Leave empty and new workspaces get no
  # subscription row, which resolves to unlimited.
  KERN_DEFAULT_PLAN_SLUG: ${KERN_DEFAULT_PLAN_SLUG:-}
  # `open` lets anyone create an account; `invite` limits it to an invitation or an administrator.
  # It seeds the setting on the very first boot only — afterwards Admin -> Settings owns it, and
  # changing this does nothing. Unset is the safe default for a server on the internet: core then
  # seeds invite-only whenever a bootstrap admin is configured below.
  #
  # Written with no value on purpose, which is Compose's pass-through form: the variable reaches the
  # container only when it is actually set, and is absent otherwise. Interpolating it with an empty
  # `:-` default looks equivalent and is not — that sets the variable to the empty string, and core
  # parses this with `z.enum(['open','invite']).optional()`, which rejects '' as "Invalid option"
  # rather than reading it as absent. That throws during core's boot, and core-worker, chat, mail and
  # collab all wait on `condition: service_healthy`, so a fresh install came up with nothing running.
  #
  # `.env.example` ships the line commented out for the same reason: a blank assignment in .env is a
  # value, and it would defeat the pass-through.
  KERN_SIGNUP:

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment: { KERN_DOMAIN: "${KERN_DOMAIN}", ACME_EMAIL: "${ACME_EMAIL}" }
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy_data:/data", "caddy_config:/config"]
    depends_on: [app, core]

  app:
    image: ${KERN_IMAGE_SHELL:-ghcr.io/kernaio/shell}:${KERN_VERSION}
    restart: unless-stopped
    environment:
      <<: *kern-env
      PORT: 3000
      ORIGIN: ${KERN_BASE_URL}
      PUBLIC_API_URL: ${KERN_BASE_URL}
      PUBLIC_WS_URL: ${KERN_BASE_URL}/ws
      PUBLIC_COLLAB_URL: ${KERN_BASE_URL}/collab
      # Where the app reaches core when it renders a page ITSELF, rather than telling a browser
      # where to go. The PUBLIC_* addresses above are browser addresses; using one for a server-side
      # call sends the shell container out through Caddy and back in to reach a service one hop away
      # on the same network.
      #
      # That is not merely wasteful. On an IP or LAN install, install.sh sets ACME_EMAIL=internal and
      # Caddy issues its own certificate from a CA nothing trusts — so Node's fetch rejects it and
      # every server-rendered published Quire page fails, on the one topology that cannot be fixed by
      # getting a real certificate. Defaulted rather than required, so an instance whose .env predates
      # this key still gets the right address.
      KERN_API_ORIGIN: ${KERN_API_ORIGIN:-http://core:4000}
      # Which social buttons the sign-in and sign-up screens draw. This is the half that is easy to
      # miss: configuring the credentials on core makes the provider *work*, and nothing appears
      # until this list names it too, because the shell has no way to ask core what is configured.
      # A comma-separated subset of google,github,microsoft; anything else in it is ignored.
      PUBLIC_AUTH_PROVIDERS:
    depends_on: [core]

  # The social sign-in credentials are on core alone, not in the shared environment: core is the only
  # service that reads them, and a client secret handed to every container is a secret with six ways
  # out instead of one. Same reasoning as MAIL_WEBHOOK_TOKEN on `mail` below.
  #
  # Each is written as a bare key — Compose's pass-through form — so the variable reaches core only
  # when the operator has actually set it, and is absent otherwise. core builds its provider list with
  # `if (env.GOOGLE_CLIENT_ID && env.GOOGLE_CLIENT_SECRET)`, so a half-configured pair simply leaves
  # that provider off rather than registering a provider that cannot complete a sign-in.
  core:
    image: ${KERN_IMAGE_CORE:-ghcr.io/kernaio/core}:${KERN_VERSION}
    restart: unless-stopped
    environment:
      <<: *kern-env
      PORT: 4000
      KERN_ADMIN_EMAIL: "${KERN_ADMIN_EMAIL}"
      KERN_ADMIN_PASSWORD: "${KERN_ADMIN_PASSWORD}"
      GOOGLE_CLIENT_ID:
      GOOGLE_CLIENT_SECRET:
      GITHUB_CLIENT_ID:
      GITHUB_CLIENT_SECRET:
      MICROSOFT_CLIENT_ID:
      MICROSOFT_CLIENT_SECRET:
      # Absent means `common` — any Microsoft account. Set it to a directory id to admit one tenant.
      MICROSOFT_TENANT_ID:
    depends_on: { db-init: { condition: service_completed_successfully }, postgres: { condition: service_healthy }, nats: { condition: service_started }, valkey: { condition: service_started }, minio: { condition: service_started } }
    # No healthcheck override here. The image already carries one, and it is the only kind that
    # can work: node:24-slim has neither wget nor curl, so a `wget` test can never run, and the
    # service listens on IPv4 only, so `localhost` resolves to ::1 and is refused. The override
    # that used to sit here failed on both counts, so core was permanently unhealthy — and
    # core-worker, chat, mail and collab all wait on `condition: service_healthy`, so none of
    # them ever started. The Dockerfile probes 127.0.0.1 with `node -e fetch(...)` instead.

  core-worker:
    image: ${KERN_IMAGE_CORE:-ghcr.io/kernaio/core}:${KERN_VERSION}
    command: ["node", "dist/worker.js"]
    restart: unless-stopped
    environment: *kern-env
    depends_on: { core: { condition: service_healthy } }

  # chat, mail and collab each own module schemas and migrate them in their own process at boot, so
  # they need db-init to have finished too — waiting on core alone would be waiting on the wrong
  # thing the first time one of them starts without core restarting.
  chat:
    image: ghcr.io/kernaio/chat:${KERN_VERSION}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4100 }
    depends_on: { core: { condition: service_healthy }, db-init: { condition: service_completed_successfully } }

  # MAIL_WEBHOOK_TOKEN is the shared secret a provider's bounce and complaint webhooks must present.
  # It is on this service alone rather than in the shared environment: nothing else reads it, and a
  # secret handed to every container is a secret with six ways out instead of one.
  #
  # Without it the endpoint was open to the internet, and a forged bounce permanently suppresses an
  # address instance-wide — anyone could have stopped mail to any recipient. install.sh generates
  # this beside the other secrets; kern-upgrade.sh fills it in for an instance that predates it. If
  # it is ever empty, mail refuses every webhook rather than trusting one, so the failure is
  # deliveries that stop being marked bounced — never a forged suppression.
  mail:
    image: ghcr.io/kernaio/mail:${KERN_VERSION}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4200, MAIL_WEBHOOK_TOKEN: "${MAIL_WEBHOOK_TOKEN}" }
    depends_on: { core: { condition: service_healthy }, db-init: { condition: service_completed_successfully } }

  collab:
    image: ghcr.io/kernaio/collab:${KERN_VERSION}
    restart: unless-stopped
    environment: { <<: *kern-env, PORT: 4300 }
    depends_on: { core: { condition: service_healthy }, db-init: { condition: service_completed_successfully } }

  # Opt-in: `docker compose --profile autoupdate up -d`.
  #
  # It exists so an admin can have Kern update itself on a host with no systemd timer. Mounting the
  # Docker socket gives this container control of the whole host — a compromise of Kern becomes a
  # compromise of everything Docker runs here — so it is off unless you ask for it, and the timer in
  # `systemd/` is the better answer when you have systemd.
  #
  # Its image tag is deliberately not ${KERN_VERSION}: an upgrade must not recreate the container
  # that is running the upgrade.
  #
  # It mounts this directory at its own host path, not at /kern, and that is load-bearing rather
  # than tidiness. Everything in here runs `docker compose` against the host's daemon over the
  # socket, and Compose resolves a relative bind mount (`./Caddyfile`, `./postgres-init`) against
  # the directory holding the compose file — then hands the daemon that path as a *host* path. Under
  # the old `.:/kern` mapping the daemon was told to bind `/kern/Caddyfile`, which does not exist on
  # the host, so Docker created an empty directory there and Caddy came back up with no config.
  # Mounting the directory at the same absolute path inside and out makes both resolutions agree.
  # KERN_DIR is written to .env by install.sh; ${PWD} is the fallback for an instance installed
  # before it was, and is correct because every entry point here cd's to this directory first.
  updater:
    image: docker:27-cli
    profiles: [autoupdate]
    restart: unless-stopped
    environment: { TZ: "${TZ:-UTC}" }
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${KERN_DIR:-${PWD}}:${KERN_DIR:-${PWD}}
    working_dir: ${KERN_DIR:-${PWD}}
    entrypoint:
      - /bin/sh
      - -c
      - >
        apk add --no-cache bash curl python3 docker-cli-compose >/dev/null &&
        while true; do bash ./kern-upgrade.sh --auto || true; sleep 3600; done

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment: { POSTGRES_USER: "${POSTGRES_USER}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: "${POSTGRES_DB}" }
    volumes: ["pgdata:/var/lib/postgresql", "./postgres-init:/docker-entrypoint-initdb.d:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"], interval: 5s, timeout: 5s, retries: 20 }

  # Runs to completion on every `up`, before any service starts. Two jobs, both idempotent, because
  # every boot re-runs this:
  #
  #   1. The extensions. postgres-init/ only runs on a data directory created from nothing, so an
  #      instance that already exists never gets a newly needed one — and a module reaching for an
  #      extension nobody created fails inside its own migration, which takes down the whole host
  #      service rather than one feature. module-inventory's gist exclusion constraint needs
  #      btree_gist; core hosts five modules and would never bind :4000.
  #   2. The role the services actually connect as. POSTGRES_USER is this image's bootstrap
  #      superuser, and a superuser bypasses row-level security unconditionally — so every
  #      `force row level security` in every migration was dead while DATABASE_URL pointed at it.
  #      kern_app is NOSUPERUSER NOBYPASSRLS and owns the database and everything already in it,
  #      which is what makes the policies start applying. Ownership is reassigned rather than only
  #      granted, so this works on an instance that already has data.
  #
  # The SQL is inline and contains no `$` at all, on purpose. The Coolify copy of this stack has no
  # files to mount beside it, so the same block has to survive being pasted into a Compose command
  # string, which Compose interpolates before the shell ever sees it. That rules out `do $$ … $$`
  # blocks — the conditional statements are `\gexec` instead — and the password reaches psql through
  # `\getenv`, never through the shell.
  db-init:
    image: pgvector/pgvector:pg18
    restart: "no"
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      PGHOST: postgres
      PGUSER: "${POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB}"
      KERN_DB_APP_PASSWORD: "${KERN_DB_APP_PASSWORD}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -q -f - <<'SQL'
        \getenv app_password KERN_DB_APP_PASSWORD

        CREATE EXTENSION IF NOT EXISTS vector;
        CREATE EXTENSION IF NOT EXISTS pg_trgm;
        CREATE EXTENSION IF NOT EXISTS ltree;
        CREATE EXTENSION IF NOT EXISTS pgcrypto;
        CREATE EXTENSION IF NOT EXISTS btree_gist;

        SELECT 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
        WHERE EXISTS (SELECT 1 FROM pg_available_extensions WHERE name = 'pg_stat_statements')
        \gexec

        SELECT 'CREATE ROLE kern_app LOGIN'
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'kern_app')
        \gexec

        ALTER ROLE kern_app WITH LOGIN NOSUPERUSER NOBYPASSRLS NOCREATEDB NOCREATEROLE
          PASSWORD :'app_password';

        SELECT format('ALTER DATABASE %I OWNER TO kern_app', current_database())
        \gexec

        SELECT format('ALTER SCHEMA %I OWNER TO kern_app', nspname)
        FROM pg_namespace
        WHERE nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND nspname NOT IN ('information_schema', 'public')
          AND nspowner <> 'kern_app'::regrole
          AND NOT EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_namespace'::regclass AND d.objid = pg_namespace.oid
                            AND d.deptype = 'e')
        \gexec

        SELECT format('ALTER %s %I.%I OWNER TO kern_app',
                      CASE c.relkind WHEN 'S' THEN 'SEQUENCE'
                                     WHEN 'v' THEN 'VIEW'
                                     WHEN 'm' THEN 'MATERIALIZED VIEW'
                                     WHEN 'f' THEN 'FOREIGN TABLE'
                                     ELSE 'TABLE' END,
                      n.nspname, c.relname)
        FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
        WHERE n.nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND n.nspname <> 'information_schema'
          AND c.relkind IN ('r', 'p', 'v', 'm', 'S', 'f')
          AND c.relowner <> 'kern_app'::regrole
          AND NOT EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                            AND d.deptype = 'e')
          AND NOT (c.relkind = 'S' AND EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                            AND d.deptype IN ('a', 'i')))
        \gexec

        SELECT format('ALTER ROUTINE %s OWNER TO kern_app', p.oid::regprocedure)
        FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
        WHERE n.nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND n.nspname <> 'information_schema'
          AND p.proowner <> 'kern_app'::regrole
          AND NOT EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_proc'::regclass AND d.objid = p.oid AND d.deptype = 'e')
        \gexec

        SELECT format('ALTER TYPE %s OWNER TO kern_app', t.oid::regtype)
        FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
        WHERE n.nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND n.nspname <> 'information_schema'
          AND t.typtype IN ('e', 'c', 'd', 'r')
          AND t.typowner <> 'kern_app'::regrole
          AND NOT EXISTS (SELECT 1 FROM pg_class c WHERE c.reltype = t.oid)
          AND NOT EXISTS (SELECT 1 FROM pg_depend d
                          WHERE d.classid = 'pg_type'::regclass AND d.objid = t.oid AND d.deptype = 'e')
        \gexec

        SELECT format('GRANT ALL ON DATABASE %I TO kern_app', current_database())
        \gexec

        SELECT format('GRANT ALL ON SCHEMA %I TO kern_app', nspname)
        FROM pg_namespace
        WHERE nspname NOT LIKE 'pg!_%' ESCAPE '!'
          AND nspname <> 'information_schema'
        \gexec
        SQL

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "--store_dir", "/data"]
    volumes: ["natsdata:/data"]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1000", "--appendonly", "no"]
    volumes: ["valkeydata:/data"]

  # Pinned, not `latest`. This artifact's whole promise is a reproducible upgrade and a rollback
  # that lands somewhere known, and `latest` breaks both: two hosts installing a week apart get
  # different MinIO builds, and MinIO in particular has changed its licence and dropped features
  # across releases. Move these deliberately, in a commit.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data
    environment: { MINIO_ROOT_USER: "${S3_ACCESS_KEY}", MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY}" }
    volumes: ["miniodata:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} && mc mb -p local/${S3_BUCKET} || true"

  livekit:
    image: livekit/livekit-server:v1.13.6
    profiles: [calls]
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment: { LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}" }
    volumes: ["./livekit.yaml:/etc/livekit.yaml:ro"]
    # Two ports, and both are named in livekit.yaml: 7882/udp carries every participant's media on
    # one multiplexed socket and 7881/tcp is the fallback where a network blocks UDP. This published
    # 50000-50200/udp until 2026-09-05 — 201 ports and 201 firewall rules. 7880 stays inside the
    # Compose network: signalling is reached through Caddy on 443, and LiveKit's admin API is not
    # something to put on the internet.
    ports: ["7881:7881", "7882:7882/udp"]

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: [preview]
    restart: unless-stopped

volumes: { pgdata: {}, natsdata: {}, valkeydata: {}, miniodata: {}, caddy_data: {}, caddy_config: {} }
