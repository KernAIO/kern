name: Release
# Cuts one platform version out of whatever landed since the last one — nightly, with nobody
# watching, and safe to apply unattended.
#
# Kern releases as a single platform: every image and every module moves together under one
# KERN_VERSION, so a release is not a per-repository act. Each night this workflow:
#
#   1. advances every service repository to the newest *compatible* @kernhq packages (the reach),
#      commits that with a lockfile on a `release/reach` branch, waits for the repository's own
#      CI, and lands it on main only if every service passed — all or nothing, because a module's
#      server runs in `core` and its client in `shell`, and two versions of one module in one
#      release is a contract mismatch;
#   2. works the version out of what moved: Conventional Commit subjects in the service
#      repositories, plus the semver distance every module and framework package travelled;
#   3. refuses to tag a main whose CI is not green, tags the same version in every service
#      repository, waits for every image to exist;
#   4. writes the release notes — each service's commits, and every module's changelog entries
#      between the version the previous release carried and the one this release carries — and
#      publishes them as a *draft*, so nobody can see a version before its feed exists;
#   5. hands it to `release-feed.yml`, which signs the feed, publishes the release, and tells the
#      cloud to roll out.
#
# The reach exists because five releases in a row (0.1.0–0.1.4) shipped modules published on
# 2026-08-27 while npm was six versions ahead: a caret on 0.x never crosses a minor, and a cached
# Docker layer never re-resolves a patch. A release is a claim about what changed; this is what
# makes the claim true.
#
# A reach that fails CI is not a broken night: the release is cut from main as it is, and the run
# ends red with the branch named, so a person republishes the module that fell behind.
on:
  schedule:
    # 02:00 UTC — after the day's pushes, before anyone is looking.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Override the bump; auto reads it from the commits and the module moves'
        required: true
        default: auto
        type: choice
        options: [auto, patch, minor, major]
      force:
        description: 'Release even if nothing changed'
        required: false
        default: false
        type: boolean
      reach:
        description: 'Advance the services to the newest compatible @kernhq packages first'
        required: false
        default: true
        type: boolean

permissions: { contents: write, actions: write, issues: write }
concurrency:
  group: release
  cancel-in-progress: false

env:
  # The repositories that build an image. A release is defined by these; docs and website ship on
  # their own and carry no KERN_VERSION.
  SERVICES: core shell chat mail collab
  # GITHUB_TOKEN reads this repository's releases; it cannot touch the service repositories. The
  # fine-grained PAT is the other way round — scoped to the service repositories only.
  SERVICES_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }

      - name: Find the previous release and what it contained
        id: prev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A draft is a release whose feed never got attached; it is not something to count from.
          PREV=$(gh release list --repo "${{ github.repository }}" --exclude-drafts --exclude-pre-releases \
                   --limit 1 --json tagName --jq '.[0].tagName // empty' | sed 's/^v//')
          PREV=${PREV:-0.0.0}
          echo "version=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous release: $PREV"

          # The module versions the previous images actually carried, from the signed feed. This is
          # what the notes and the bump compare against — not what a range would have resolved to,
          # because a cached layer can be older than that.
          echo '{}' > prev-modules.json
          if [ "$PREV" != "0.0.0" ] && curl -fsSL -o previous.json \
               "https://github.com/${{ github.repository }}/releases/download/v$PREV/releases.json"; then
            node -e '
              const doc = JSON.parse(require("fs").readFileSync("previous.json", "utf8"))
              const feed = JSON.parse(Buffer.from(doc.payload, "base64").toString("utf8"))
              const entry = feed.releases.find((r) => r.version === process.argv[1])
              require("fs").writeFileSync("prev-modules.json", JSON.stringify(entry?.modules ?? {}))
            ' "$PREV"
            echo "Modules in v$PREV: $(cat prev-modules.json)"
          else
            echo "::warning::No feed for v$PREV could be read; module moves will be reported from the ranges instead."
          fi

      # On a `schedule` event every `inputs.*` is null, and GitHub's expression language coerces
      # null and false to the same number — so `inputs.reach != false` was *false* on every nightly
      # run and this step was skipped from the day it was written. Two scheduled releases shipped
      # with the reach silently absent while the run reported success, and the only reach that ever
      # ran was a hand dispatch. Name the event rather than testing an input that is not there.
      - name: Advance every service to the newest compatible @kernhq packages
        id: reach
        if: github.event_name == 'schedule' || inputs.reach == true
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/reach"
          mkdir -p "$WORK"
          echo "outcome=none" >> "$GITHUB_OUTPUT"
          : > reach-shas.txt

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FILES=""
          for repo in $SERVICES; do
            # The token in the URL is what lets the pushes below authenticate; the runner is
            # thrown away with it.
            git clone --quiet --depth=50 "https://x-access-token:$GH_TOKEN@github.com/KernAIO/$repo" "$WORK/$repo"
            FILES="$FILES $WORK/$repo/package.json"
          done

          # One computation for every service, so core and shell agree on each module's version.
          # shellcheck disable=SC2086
          if ! node scripts/reach.mjs --write --json $FILES > reach.json; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            echo "reason=reach.mjs could not resolve the registry" >> "$GITHUB_OUTPUT"
            echo "::warning::The reach could not be computed; releasing main as it is."
            exit 0
          fi

          PENDING=0
          for repo in $SERVICES; do
            cd "$WORK/$repo"
            if git diff --quiet -- package.json && [ -f pnpm-lock.yaml ]; then
              echo "$repo: nothing to advance"
              continue
            fi
            # The lockfile is what makes the image's contents a committed fact: Docker's deps layer
            # is keyed on it, so a moved lockfile is a rebuilt layer, and a frozen install in CI
            # proves the same tree builds there. `strict-peer-dependencies` in the host's .npmrc
            # turns an incompatible module into a failure here, before anything is pushed.
            if ! pnpm install --lockfile-only; then
              echo "outcome=failed" >> "$GITHUB_OUTPUT"
              echo "reason=$repo: pnpm could not produce a lockfile for the advanced ranges" >> "$GITHUB_OUTPUT"
              echo "::warning::$repo: the advanced ranges do not resolve; releasing main as it is."
              exit 0
            fi
            git add package.json pnpm-lock.yaml
            git commit -q -m "chore(release): reach the newest compatible @kernhq packages" \
              -m "Advanced by the nightly release so the images carry the modules published since the last one."
            git push -q --force origin "HEAD:refs/heads/release/reach"
            git rev-parse HEAD | sed "s/^/$repo /" >> "$GITHUB_WORKSPACE/reach-shas.txt"
            echo "$repo: pushed $(git rev-parse --short HEAD) to release/reach"
            PENDING=$((PENDING + 1))
          done
          if [ "$PENDING" -gt 0 ]; then echo "outcome=pending" >> "$GITHUB_OUTPUT"; fi

      - name: Wait for CI on every reach branch
        id: reach-ci
        if: steps.reach.outputs.outcome == 'pending'
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          FAILED=""
          while read -r repo sha; do
            .github/scripts/wait-green.sh "KernAIO/$repo" "$sha" 45 || FAILED="$FAILED $repo"
          done < reach-shas.txt
          if [ -n "$FAILED" ]; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            echo "reason=CI failed on the release/reach branch of:$FAILED" >> "$GITHUB_OUTPUT"
            echo "::warning::CI failed on release/reach in:$FAILED. Releasing main as it is; the branch is left for a person to read."
          else
            echo "outcome=green" >> "$GITHUB_OUTPUT"
          fi

      - name: Land the reach on main — every service, or none
        id: land
        if: steps.reach-ci.outputs.outcome == 'green'
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          while read -r repo sha; do
            cd "$RUNNER_TEMP/reach/$repo"
            if git push -q origin "$sha:refs/heads/main"; then
              echo "$repo: main is now ${sha:0:8}"
              continue
            fi
            # main moved while CI ran. The reach only touches package.json and the lockfile, so
            # replay it on top and let the green-main check below wait for the new commit's CI.
            git fetch -q origin main
            if git rebase -q origin/main; then
              git push -q origin "HEAD:refs/heads/main"
              echo "$repo: main moved during CI; reach rebased and landed as $(git rev-parse --short HEAD)"
            else
              echo "::error::$repo: main moved during CI and the reach no longer applies. Some services have the new pins and this one does not — resolve release/reach by hand before the next release."
              exit 1
            fi
          done < reach-shas.txt
          echo "landed=true" >> "$GITHUB_OUTPUT"

      - name: Work out the next version
        id: v
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
          PREV: ${{ steps.prev.outputs.version }}
          BUMP_INPUT: ${{ inputs.bump || 'auto' }}
        run: |
          set -euo pipefail
          BUMP="$BUMP_INPUT"
          if [ "$BUMP" = "auto" ]; then
            BUMP=patch
            # Read the bump out of the commits rather than asking anyone. The repositories are held
            # to Conventional Commits, so the information is already there: a `feat:` is a minor,
            # a `!` or a BREAKING CHANGE trailer is a major, and everything else is a patch.
            for repo in $SERVICES; do
              if [ "$PREV" = "0.0.0" ]; then
                LOG=$(gh api "/repos/KernAIO/$repo/commits?sha=main&per_page=100" --jq '.[].commit.message')
              else
                LOG=$(gh api "/repos/KernAIO/$repo/compare/v$PREV...main" --jq '.commits[].commit.message' 2>/dev/null || echo "")
              fi
              if echo "$LOG" | grep -qE '^[a-z]+(\([^)]*\))?!:' || echo "$LOG" | grep -q 'BREAKING CHANGE'; then
                BUMP=major; break
              fi
              if echo "$LOG" | grep -qE '^feat(\([^)]*\))?:'; then BUMP=minor; fi
            done
            # A module that moved a minor moved the platform a minor: its own commits said `feat:`
            # when it published, and this release is the first time an instance can have it.
            if [ -f reach.json ] && [ "${{ steps.land.outputs.landed }}" = "true" ] && [ "$BUMP" = "patch" ]; then
              MODULE_BUMP=$(node -e '
                const reach = JSON.parse(require("fs").readFileSync("reach.json", "utf8"))
                const prev = JSON.parse(require("fs").readFileSync("prev-modules.json", "utf8"))
                const minor = (v) => v.split(".").slice(0, 2).join(".")
                let bump = "patch"
                for (const [id, m] of Object.entries(reach.modules)) {
                  const from = prev[id] ?? m.from
                  if (from && m.to && minor(from) !== minor(m.to)) bump = "minor"
                }
                for (const f of Object.values(reach.framework))
                  if (f.from && f.to && minor(f.from) !== minor(f.to)) bump = "minor"
                console.log(bump)
              ')
              echo "Module and framework moves say: $MODULE_BUMP"
              BUMP="$MODULE_BUMP"
            fi
            echo "Commits since v$PREV say: $BUMP"
          fi

          # What the release does to the schema, worked out apart from the bump: below 1.0.0 a
          # breaking change is demoted to a minor, and a hand dispatch skips the scan above, but
          # the feed has to say the schema broke either way — an instance on `auto` reads that
          # field to decide whether it may apply the release unattended. A service commit with a
          # `!` or a BREAKING CHANGE trailer says so; so does a module whose new version's
          # changelog section carries "Major Changes", which is what a `!` changeset writes.
          SCHEMA=additive
          for repo in $SERVICES; do
            if [ "$PREV" = "0.0.0" ]; then
              LOG=$(gh api "/repos/KernAIO/$repo/commits?sha=main&per_page=100" --jq '.[].commit.message')
            else
              LOG=$(gh api "/repos/KernAIO/$repo/compare/v$PREV...main" --jq '.commits[].commit.message' 2>/dev/null || echo "")
            fi
            if echo "$LOG" | grep -qE '^[a-z]+(\([^)]*\))?!:' || echo "$LOG" | grep -q 'BREAKING CHANGE'; then
              echo "$repo: a breaking commit since v$PREV"
              SCHEMA=breaking; break
            fi
          done
          if [ -f reach.json ] && [ "$SCHEMA" = "additive" ]; then
            SCHEMA=$(node -e '
              const { execFileSync } = require("child_process")
              const reach = JSON.parse(require("fs").readFileSync("reach.json", "utf8"))
              let schema = "additive"
              for (const [id, m] of Object.entries(reach.modules)) {
                if (!m.to || m.from === m.to) continue
                let encoded = ""
                try {
                  encoded = execFileSync("gh", ["api", `/repos/KernAIO/module-${id}/contents/CHANGELOG.md`, "--jq", ".content"], { encoding: "utf8" })
                } catch { continue }
                const text = Buffer.from(encoded, "base64").toString("utf8")
                const section = text.split(/^## /m).find((s) => s.startsWith(`${m.to}\n`)) ?? ""
                if (/^### Major Changes/m.test(section)) {
                  console.error(`module-${id} ${m.to} carries a major change`)
                  schema = "breaking"
                }
              }
              console.log(schema)
            ')
          fi
          echo "schema=$SCHEMA" >> "$GITHUB_OUTPUT"
          echo "Schema: $SCHEMA"

          IFS=. read -r MA MI PA <<< "$PREV"
          # Before 1.0.0 an *inferred* breaking change is a minor, not a major. Without this the
          # first `feat!:` would quietly declare Kern 1.0.0 — a statement about stability nobody
          # meant to make. A person dispatching with bump=major means exactly that, and is the only
          # way 1.0.0 gets cut.
          if [ "$BUMP" = "major" ] && [ "$MA" = "0" ] && [ "$BUMP_INPUT" = "auto" ]; then
            echo "0.x: treating the breaking change as a minor rather than declaring 1.0.0."
            BUMP=minor
          fi
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0; PA=0 ;;
            minor) MI=$((MI+1)); PA=0 ;;
            patch) PA=$((PA+1)) ;;
          esac
          echo "next=$MA.$MI.$PA" >> "$GITHUB_OUTPUT"
          echo "Previous $PREV -> next $MA.$MI.$PA ($BUMP)"

      - name: Has anything actually shipped since then?
        id: changed
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
          PREV: ${{ steps.prev.outputs.version }}
        run: |
          set -euo pipefail
          CHANGED=false
          for repo in $SERVICES; do
            if [ "$PREV" = "0.0.0" ]; then CHANGED=true; break; fi
            # Comparing the tag against main tells us whether that repository moved. A missing tag
            # means the repository never took part in a release, which also counts as changed.
            AHEAD=$(gh api "/repos/KernAIO/$repo/compare/v$PREV...main" --jq '.ahead_by' 2>/dev/null || echo "missing")
            echo "$repo: $AHEAD commits ahead of v$PREV"
            if [ "$AHEAD" = "missing" ] || [ "${AHEAD:-0}" -gt 0 ]; then CHANGED=true; fi
          done
          # A landed reach is a change even when no service commit is: the images will carry
          # different modules.
          if [ "${{ steps.land.outputs.landed }}" = "true" ]; then CHANGED=true; fi
          if [ "${{ inputs.force || false }}" = "true" ]; then CHANGED=true; fi
          echo "value=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Nothing to release
        if: steps.changed.outputs.value != 'true'
        run: echo "Nothing moved since v${{ steps.prev.outputs.version }} — stopping."

      - name: Refuse to release a main whose CI is not green
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Images are built by docker.yml, which runs whether or not ci.yml passed — so without
          # this, a main that fails lint or tests still becomes a release and rolls onto the cloud
          # unattended. The nightly is only safe because CI is the gate; check that it actually
          # is, and wait for it rather than reading a run that has not finished.
          RED=""
          for repo in $SERVICES; do
            SHA=$(gh api "/repos/KernAIO/$repo/git/ref/heads/main" --jq '.object.sha')
            .github/scripts/wait-green.sh "KernAIO/$repo" "$SHA" 45 || RED="$RED $repo"
          done
          if [ -n "$RED" ]; then
            echo "::error::Not releasing —$RED is not green on main. Fix main, or dispatch this workflow again once CI is green."
            exit 1
          fi

      - name: Refuse to release services that disagree about a module
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # A module's server runs in a host service and its client in `shell`, so one release
          # carrying two versions of one module is a contract mismatch: the client calls procedures
          # the server has never heard of and every one of them 404s. The reach keeps them in step
          # when it lands, but a reach that fails releases main as it is, and main is edited by
          # hand — shell reached module-hr 0.22.0 on 2026-09-03 while core sat on 0.20.3.
          #
          # This read `core` and `shell` alone until 2026-09-05, and core is not the only host:
          # `chat` carries module-chat's server and `mail` carries module-mail's, both clients
          # living in shell — so the two modules whose server and client are in *different* repos
          # were the two the guard could not see. It reads every service now, and `@kernhq/contracts`
          # has to agree across all five.
          #
          # Read what each lockfile resolves, not the ranges: a range says what may install and the
          # lockfile says what the image will actually carry.
          resolved() { # resolved <repo> -> "package version" for every @kernhq package it pins
            local lock
            lock=$(gh api -H 'Accept: application/vnd.github.raw' "/repos/KernAIO/$1/contents/pnpm-lock.yaml?ref=main")
            # No match is not a failure — collab hosts no module today. A lockfile that could not be
            # fetched has already failed on the line above.
            printf '%s\n' "$lock" \
              | { grep -oE "^  '?@kernhq/(module-[a-z0-9-]+|contracts)@[0-9]+\.[0-9]+\.[0-9]+" || true; } \
              | sed -E "s/^  '?//; s/@([0-9])/ \1/" | sort -u
          }
          : > resolved.txt
          for repo in $SERVICES; do
            resolved "$repo" | sed "s|^|$repo |" >> resolved.txt
          done

          # A check that silently stops matching passes for ever and says nothing. If pnpm changes
          # how it writes a key, every service reports no packages and every release agrees.
          if [ ! -s resolved.txt ]; then
            echo "::error::No @kernhq package was found in any service lockfile, so this check just compared nothing. Either the lockfiles moved or pnpm changed the shape it writes them in."
            exit 1
          fi

          # Any package pinned to more than one version across the release — including twice within
          # one lockfile, which is a second copy of it inside one image.
          SPLIT=$(awk '{ print $2, $3 }' resolved.txt | sort -u \
                  | awk '{ n[$1]++ } END { for (p in n) if (n[p] > 1) print p }' | sort)
          if [ -n "$SPLIT" ]; then
            echo "::error::Not releasing — these images would ship different versions of the same contract:"
            for pkg in $SPLIT; do
              echo "::error::  $pkg — $(awk -v p="$pkg" '$2 == p { printf "%s %s, ", $1, $3 }' resolved.txt | sed 's/, $//')"
            done
            echo "::error::Run the reach (dispatch this workflow with reach on) or move whichever is behind; never release the set as it is."
            exit 1
          fi
          echo "every service agrees on every module and on the contracts:"
          awk '{ v[$2] = $3; where[$2] = where[$2] " " $1 } END { for (p in v) printf "  %-30s %-10s in%s\n", p, v[p], where[p] }' resolved.txt | sort

      - name: Tag every service repository
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.KERN_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          V='v${{ steps.v.outputs.next }}'
          for repo in $SERVICES; do
            SHA=$(gh api "/repos/KernAIO/$repo/git/ref/heads/main" --jq '.object.sha')
            gh api -X POST "/repos/KernAIO/$repo/git/refs" \
              -f ref="refs/tags/$V" -f sha="$SHA" >/dev/null
            echo "tagged KernAIO/$repo $V at ${SHA:0:8}"
          done

      - name: Wait for every image to exist
        if: steps.changed.outputs.value == 'true'
        run: |
          set -euo pipefail
          V='${{ steps.v.outputs.next }}'
          # release-feed.mjs reads the published images to find out what modules a release contains,
          # so the feed cannot be built until every one of them is pushed.
          for repo in $SERVICES; do
            echo "waiting for ghcr.io/kernaio/$repo:$V"
            for i in $(seq 1 60); do
              TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:kernaio/$repo:pull&service=ghcr.io" | jq -r .token)
              if curl -fsSL -H "Authorization: Bearer $TOKEN" \
                   -H 'Accept: application/vnd.oci.image.index.v1+json' \
                   "https://ghcr.io/v2/kernaio/$repo/manifests/$V" >/dev/null 2>&1; then
                echo "  built"; break
              fi
              if [ "$i" = "60" ]; then
                echo "::error::ghcr.io/kernaio/$repo:$V never appeared — check that repository's Docker workflow"
                exit 1
              fi
              sleep 20
            done
          done

      - name: Write the release notes and publish them as a draft
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV: ${{ steps.prev.outputs.version }}
          NEXT: ${{ steps.v.outputs.next }}
          LANDED: ${{ steps.land.outputs.landed || 'false' }}
          REACH_REASON: ${{ steps.reach-ci.outputs.reason || steps.reach.outputs.reason || '' }}
        run: |
          set -euo pipefail
          V="v$NEXT"
          WORK=$(mktemp -d)

          # One section per service repository: its commits since the previous version, grouped
          # by Conventional Commit type. The repositories are held to the convention, so this is
          # a read of the log, not a judgement call — and the same section becomes that
          # repository's own GitHub release, so its Releases tab is a changelog in its own right.
          for repo in $SERVICES; do
            if [ "$PREV" = "0.0.0" ]; then
              LOG=$(GH_TOKEN="$SERVICES_TOKEN" gh api "/repos/KernAIO/$repo/commits?sha=main&per_page=100" \
                      --jq '.[].commit.message | split("\n")[0]' 2>/dev/null || true)
            else
              LOG=$(GH_TOKEN="$SERVICES_TOKEN" gh api "/repos/KernAIO/$repo/compare/v$PREV...$V" \
                      --jq '.commits[] | .commit.message | split("\n")[0]' 2>/dev/null || true)
            fi
            # Version and reach commits are bookkeeping, not changelog.
            LOG=$(echo "$LOG" | grep -vE '^chore(\(release\))?: (version|reach)' | sort -u || true)
            [ -n "$LOG" ] || continue
            echo "$LOG" | grep -c . > "$WORK/$repo.count"
            {
              echo "### $repo"
              echo
              for TYPE in feat fix perf refactor docs test ci; do
                GROUP=$(echo "$LOG" | grep -E "^$TYPE(\([^)]*\))?!?:" || true)
                [ -n "$GROUP" ] || continue
                echo "**${TYPE^}**"
                echo
                echo "$GROUP" | sed 's/^/- /'
                echo
              done
              OTHER=$(echo "$LOG" | grep -vE '^(feat|fix|perf|refactor|docs|test|ci|chore)(\([^)]*\))?!?:' || true)
              if [ -n "$OTHER" ]; then
                echo "**Other**"
                echo
                echo "$OTHER" | sed 's/^/- /'
                echo
              fi
              echo "[compare v$PREV...$V](https://github.com/KernAIO/$repo/compare/v$PREV...$V)"
              echo
            } > "$WORK/$repo.md"
          done

          # Every module this release carries at a different version from the last one, with the
          # changelog entries of each version in between — read from the module repository's own
          # releases, which `publish.yml` writes from its CHANGELOG. This is the part a self-hoster
          # cannot work out from the service commits, and the part that used to be missing.
          if [ -f reach.json ] && [ "$LANDED" = "true" ]; then
            node - "$WORK/modules.md" <<'NODE'
              const { execFileSync } = require('node:child_process')
              const fs = require('node:fs')
              const out = process.argv[2]
              const reach = JSON.parse(fs.readFileSync('reach.json', 'utf8'))
              const prev = JSON.parse(fs.readFileSync('prev-modules.json', 'utf8'))
              const parse = (v) => v.split('-')[0].split('.').map(Number)
              const gt = (a, b) => { const [x, y] = [parse(a), parse(b)]; return x[0] - y[0] || x[1] - y[1] || x[2] - y[2] }
              const lines = []
              const moved = []
              for (const [id, m] of Object.entries(reach.modules).sort()) {
                const from = prev[id] ?? m.from
                if (!from || !m.to || from === m.to) continue
                moved.push(`| ${id} | ${from} | ${m.to} |`)
                lines.push(`### ${id} ${from} → ${m.to}`, '')
                const repo = `KernAIO/module-${id}`
                let versions = []
                try {
                  versions = JSON.parse(execFileSync('npm', ['view', m.name, 'versions', '--json'], { encoding: 'utf8' }))
                    .filter((v) => gt(v, from) > 0 && gt(v, m.to) <= 0 && !v.includes('-'))
                    .sort((a, b) => gt(a, b))
                } catch {}
                for (const v of versions) {
                  let body = ''
                  try {
                    body = execFileSync('gh', ['release', 'view', `v${v}`, '--repo', repo, '--json', 'body', '-q', '.body'],
                      { encoding: 'utf8', env: { ...process.env, GH_TOKEN: process.env.SERVICES_TOKEN } }).trim()
                  } catch {}
                  lines.push(`**${v}** — [release](https://github.com/${repo}/releases/tag/v${v})`, '')
                  if (body) lines.push(body.replace(/^## .*\n/, '').trim(), '')
                }
              }
              const fw = Object.entries(reach.framework).filter(([, f]) => f.from && f.to && f.from !== f.to)
              const doc = []
              if (moved.length) {
                doc.push('## Modules', '', '| module | was | now |', '|:--|:--|:--|', ...moved, '', ...lines)
              }
              if (fw.length) {
                doc.push('## Framework', '', ...fw.map(([n, f]) => `- \`${n}\` ${f.from} → ${f.to} — [releases](https://github.com/KernAIO/kernel/releases)`), '')
              }
              fs.writeFileSync(out, doc.join('\n'))
          NODE
          fi

          {
            echo "One platform version — every image and every module inside it carries \`$V\`."
            echo
            echo "| repository | moved |"
            echo "|:-----------|:------|"
            for repo in $SERVICES; do
              if [ -f "$WORK/$repo.count" ]; then
                echo "| [$repo](https://github.com/KernAIO/$repo) | $(cat "$WORK/$repo.count") commits |"
              else
                echo "| $repo | no change |"
              fi
            done
            echo
            if [ -s "$WORK/modules.md" ]; then cat "$WORK/modules.md"; echo; fi
            if [ -n "$REACH_REASON" ]; then
              echo "> **Modules were not advanced in this release.** $REACH_REASON"
              echo
            fi
            if ls "$WORK"/*.md >/dev/null 2>&1; then echo "## Services"; echo; fi
            for repo in $SERVICES; do
              [ -f "$WORK/$repo.md" ] && cat "$WORK/$repo.md"
            done
          } > "$WORK/body.md"

          # A draft: the feed is what makes a release installable, and it is attached by
          # release-feed.yml, which publishes the release once it is there. Until then
          # `releases/latest` still points at the previous release, so an instance checking in
          # the meantime reads a feed that exists rather than a 404.
          if gh release view "$V" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$V" --repo "${{ github.repository }}" --notes-file "$WORK/body.md"
          else
            gh release create "$V" --repo "${{ github.repository }}" --draft --title "$V" --notes-file "$WORK/body.md"
          fi

          # The same section becomes the service repository's own release — its Releases tab is
          # a changelog, not a list of bare v-tags the umbrella created over there.
          for repo in $SERVICES; do
            [ -f "$WORK/$repo.md" ] || continue
            if GH_TOKEN="$SERVICES_TOKEN" gh release view "$V" --repo "KernAIO/$repo" >/dev/null 2>&1; then continue; fi
            GH_TOKEN="$SERVICES_TOKEN" gh release create "$V" \
              --repo "KernAIO/$repo" --title "Kern $V" --notes-file "$WORK/$repo.md"
          done

      # Creating the release with GITHUB_TOKEN does not fire this repository's `release:` event —
      # GitHub suppresses events a workflow's own token caused — so the feed is dispatched by name.
      # It signs releases.json, attaches it, publishes the draft, and then dispatches the cloud
      # rollout itself.
      - name: Hand the release to the feed
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release-feed.yml \
            --repo "${{ github.repository }}" \
            --field version="${{ steps.v.outputs.next }}" \
            --field previous="${{ steps.prev.outputs.version }}" \
            --field schema="${{ steps.v.outputs.schema }}"

      - name: Say so if the modules could not be advanced
        if: steps.reach.outputs.outcome == 'failed' || steps.reach-ci.outputs.outcome == 'failed'
        run: |
          echo "::error::The release went out from main as it was, but the modules could not be advanced: ${{ steps.reach-ci.outputs.reason || steps.reach.outputs.reason }}. Read the release/reach branch in that repository; the usual cause is a module whose peer ranges have not caught up with the framework, and the fix is to republish the module."
          exit 1

      # A red run at 02:00 that nobody reads is a release that silently did not happen. An issue is
      # what GitHub already emails to everyone watching the repository, so a failure opens one —
      # or comments on the one still open, so a week of red nights is one thread rather than seven.
      - name: Tell somebody
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="The release workflow ended red on $(date -u +%Y-%m-%d) (${{ github.event_name }}). Read the run: $url

          Runbook: docs/developers/releases-and-migrations.md, *When the nightly is red*."
          existing=$(gh issue list --repo "${{ github.repository }}" --label release-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "Nightly release failed on $(date -u +%Y-%m-%d)" --label release-failure --body "$body"
          fi
